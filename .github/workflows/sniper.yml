name: Opportunity Sniper

on:
  schedule:
    # Runs every 3 hours (8 times a day)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Sniper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python sniper.py

      - name: Commit database updates separately
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit AI deals updates if any
          touch seen_ai_deals.txt
          git add seen_ai_deals.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen AI deals database"
          
          # Commit scholarships updates if any
          touch seen_scholarships.txt
          git add seen_scholarships.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen scholarships database"
          
          # Push both commits
          git push